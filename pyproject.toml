[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xefl-data-analysis"
version = "0.1.0"
description = "Minimal XFEL beam and detector data analysis project"
requires-python = ">=3.11"

dependencies = [
    "extra-data",
    "xarray",
    "numpy",
    "matplotlib",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]